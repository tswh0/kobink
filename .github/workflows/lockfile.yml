name: lockfile

on:
  push:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: resolve and verify
        run: |
          set +e
          cargo update -p axum -p tower -p tower-http -p base64 2>&1 | tee update.log || cargo generate-lockfile 2>&1 | tee -a update.log
          cargo check --locked --all-targets 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error" -A8 check.log | head -100 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=cargo::$line"
            done
            exit $status
          fi

      - name: commit
        run: |
          if git diff --quiet Cargo.lock; then
            echo "lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: resolve axum 0.8 stack"
          git push
