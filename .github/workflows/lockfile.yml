name: lockfile

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: update
        run: cargo update

      - name: verify
        run: |
          set +e
          cargo check --all-targets 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error" -A6 check.log | head -60 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=cargo::$line"
            done
          fi
          exit $status

      - name: commit
        if: success()
        run: |
          if git diff --quiet Cargo.lock; then
            echo "lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update dependencies"
          git push
