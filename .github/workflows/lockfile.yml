name: lockfile

on:
  push:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: bump epub, verify
        run: |
          set +e
          cargo update -p epub --precise 2.1.6 2>&1 | tee update.log
          cargo check --locked --all-targets 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error" -A6 check.log | head -80 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=cargo::$line"
            done
            exit $status
          fi

      - name: commit
        run: |
          if git diff --quiet Cargo.lock; then
            echo "lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: epub 2.1.6, zip 9"
          git push
