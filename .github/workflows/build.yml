name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: cargo check
        run: |
          set +e
          cargo check --locked --all-targets 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error" -A5 check.log | head -50 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=cargo::$line"
            done
          fi
          exit $status

  smoke:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: build
        run: |
          set +e
          cargo build --release --locked --target x86_64-unknown-linux-musl 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error" -A5 build.log | head -50 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=cargo::$line"
            done
          fi
          exit $status

      - name: kobo protocol smoke test
        env:
          BIN: target/x86_64-unknown-linux-musl/release/kobink
          API_KEY: smoketestkey123
          LIBRARY_PATH: /tmp/library
          PUBLIC_URL: http://127.0.0.1:3000
          LIBRARY_REFRESH_SECONDS: "2"
          COVER_CACHE_DIR: /tmp/covers
          RUST_LOG: info
        run: bash ci/smoke.sh
