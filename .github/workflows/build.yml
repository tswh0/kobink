name: build

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config

      - name: cargo check
        run: |
          set +e
          cargo check --locked --all-targets 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error" -A5 check.log | head -50 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=cargo::$line"
            done
          fi
          exit $status

  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config

      - name: build
        run: |
          set +e
          cargo build --release --locked 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error" -A5 build.log | head -50 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=cargo::$line"
            done
          fi
          exit $status

      - name: auth, scan, sync and download
        env:
          API_KEY: smoketestkey123
          LIBRARY_PATH: /tmp/library
          PUBLIC_URL: http://127.0.0.1:3000
          LIBRARY_REFRESH_SECONDS: "2"
          RUST_LOG: info
        run: |
          mkdir -p "$LIBRARY_PATH"

          python3 - <<'PY'
          import base64, os, zipfile

          PNG = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          )

          def make_epub(path, title, author):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              opf = f"""<?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="id">
            <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
              <dc:identifier id="id">urn:uuid:12345678-1234-1234-1234-123456789abc</dc:identifier>
              <dc:title>{title}</dc:title>
              <dc:creator>{author}</dc:creator>
              <dc:language>en</dc:language>
              <meta property="dcterms:modified">2026-01-01T00:00:00Z</meta>
              <meta name="cover" content="cover-img"/>
            </metadata>
            <manifest>
              <item id="c1" href="chapter1.xhtml" media-type="application/xhtml+xml"/>
              <item id="cover-img" href="cover.png" media-type="image/png" properties="cover-image"/>
            </manifest>
            <spine><itemref idref="c1"/></spine>
          </package>"""
              with zipfile.ZipFile(path, "w") as z:
                  z.writestr("mimetype", "application/epub+zip", compress_type=zipfile.ZIP_STORED)
                  z.writestr("META-INF/container.xml", """<?xml version="1.0"?>
          <container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
            <rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>
          </container>""")
                  z.writestr("OEBPS/content.opf", opf)
                  z.writestr("OEBPS/chapter1.xhtml",
                             "<html xmlns='http://www.w3.org/1999/xhtml'><body><h1>x</h1></body></html>")
                  z.writestr("OEBPS/cover.png", PNG)

          for v in (1, 2, 3):
              make_epub(f"/tmp/library/BLAME!/BLAME! Master Edition v0{v}.kepub.epub",
                        f"BLAME! Master Edition v0{v}", "Tsutomu Nihei")
          PY

          ./target/release/kobink > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done

          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          key=smoketestkey123

          echo "root          $(code http://127.0.0.1:3000/)"
          echo "no key        $(code http://127.0.0.1:3000/kobo/v1/user/profile)"
          echo "wrong key     $(code http://127.0.0.1:3000/nope/kobo/v1/user/profile)"
          echo "right key     $(code http://127.0.0.1:3000/$key/kobo/v1/user/profile)"
          echo "v1/v1         $(code http://127.0.0.1:3000/$key/kobo/v1/v1/initialization)"
          echo "download, no key $(code http://127.0.0.1:3000/download/abc/EPUB/x.epub)"

          sync=$(curl -s -D sync-headers.txt "http://127.0.0.1:3000/$key/kobo/v1/library/sync")
          echo "$sync" | jq -c '.[] | {id: .NewEntitlement.BookEntitlement.Id, title: .NewEntitlement.BookMetadata.Title}'
          echo "books in sync: $(echo "$sync" | jq 'length')"
          echo "distinct ids:  $(echo "$sync" | jq -r '.[].NewEntitlement.BookEntitlement.Id' | sort -u | wc -l)"
          echo "created:       $(echo "$sync" | jq -r '.[0].NewEntitlement.BookEntitlement.Created')"
          echo "series key:    $(echo "$sync" | jq '.[0].NewEntitlement.BookMetadata | has("Series")')"
          echo "synctoken:     $(grep -ci '^x-kobo-synctoken' sync-headers.txt)"

          url=$(echo "$sync" | jq -r '.[0].NewEntitlement.BookMetadata.DownloadUrls[0].Url')
          echo "format:        $(echo "$sync" | jq -r '.[0].NewEntitlement.BookMetadata.DownloadUrls[0].Format')"
          echo "download:      $(code "$url") $url"

          book=$(echo "$sync" | jq -r '.[0].NewEntitlement.BookEntitlement.Id')
          init=$(curl -s "http://127.0.0.1:3000/$key/kobo/v1/initialization")
          echo "image_host:    $(echo "$init" | jq -r '.Resources.image_host')"
          echo "image_url:     $(echo "$init" | jq -r '.Resources.image_url_template')"
          echo "metadata:      $(code "http://127.0.0.1:3000/$key/kobo/v1/library/$book/metadata")"
          cover_url="http://127.0.0.1:3000/$key/$book/400/600/false/image.jpg"
          echo "cover:         $(code "$cover_url")"
          echo "analytics:     $(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:3000/$key/kobo/v1/analytics/event")"
          echo "download ct:   $(curl -sI "$url" | tr -d '\r' | awk 'tolower($1)=="content-type:"{print $2}')"

          sleep 5
          cat server.log

          test "$(code http://127.0.0.1:3000/)" = "200"
          test "$(code http://127.0.0.1:3000/kobo/v1/user/profile)" = "404"
          test "$(code http://127.0.0.1:3000/nope/kobo/v1/user/profile)" = "404"
          test "$(code http://127.0.0.1:3000/$key/kobo/v1/user/profile)" = "200"
          test "$(code http://127.0.0.1:3000/download/abc/EPUB/x.epub)" = "404"
          test "$(code http://127.0.0.1:3000/$key/kobo/v1/v1/initialization)" = "404"
          curl -s "http://127.0.0.1:3000/$key/kobo/v1/v1/initialization" | grep -q "must end at /kobo"

          test "$(echo "$sync" | jq 'length')" = "3"
          test "$(echo "$sync" | jq -r '.[].NewEntitlement.BookEntitlement.Id' | sort -u | wc -l)" = "3"
          echo "$sync" | jq -e '.[0].NewEntitlement.BookEntitlement.Created
            | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")' > /dev/null
          test "$(echo "$sync" | jq '.[0].NewEntitlement.BookMetadata | has("Series")')" = "false"
          grep -qi '^x-kobo-synctoken: ' sync-headers.txt
          test "$(code "$url")" = "200"
          test "$(echo "$sync" | jq -r '.[0].NewEntitlement.BookMetadata.DownloadUrls[0].Format')" = "KEPUB"
          test "$(echo "$init" | jq -r '.Resources.image_host')" = "http://127.0.0.1:3000"
          echo "$init" | jq -e --arg k "$key" '.Resources.image_url_template | contains($k)' > /dev/null
          test "$(code "http://127.0.0.1:3000/$key/kobo/v1/library/$book/metadata")" = "200"
          test "$(code "$cover_url")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:3000/$key/kobo/v1/analytics/event")" = "200"
          test "$(curl -sI "$url" | tr -d '\r' | awk 'tolower($1)=="content-type:"{print $2}')" = "application/x-kobo-epub+zip"

          grep -q "api key:      $key" server.log
          grep -q "loaded 3 books" server.log
          grep -q "library refreshed" server.log
