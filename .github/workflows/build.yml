name: build

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config

      - name: cargo check
        run: |
          set +e
          cargo check --locked --all-targets 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error" -A5 check.log | head -50 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=cargo::$line"
            done
          fi
          exit $status

  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config

      - name: build
        run: |
          set +e
          cargo build --release --locked 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error" -A5 build.log | head -50 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=cargo::$line"
            done
          fi
          exit $status

      - name: kobo protocol smoke test
        env:
          API_KEY: smoketestkey123
          LIBRARY_PATH: /tmp/library
          PUBLIC_URL: http://127.0.0.1:3000
          LIBRARY_REFRESH_SECONDS: "2"
          RUST_LOG: info
        run: bash ci/smoke.sh
