name: build

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config

      - name: cargo check
        run: cargo check --locked --all-targets
