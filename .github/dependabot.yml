version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/docker"
    schedule:
      interval: weekly
    ignore:
      # pymupdf 2.x pulls onnxruntime and a layout model: ~250 MB for a path kcc never calls
      - dependency-name: "pymupdf"
        update-types: ["version-update:semver-major"]
