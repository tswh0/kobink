<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}} · kobink</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="kobink">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/style.css?v=2">
<link rel="stylesheet" href="/reader.css?v=16">
</head>
<body class="reader-page" data-book="{{ID}}">

<header class="reader-bar">
  <a class="reader-back" href="/" aria-label="Back to the library">←</a>
  <p class="reader-title">{{TITLE}}</p>
  <button class="reader-offline" id="offline" type="button" hidden>Save</button>
  <button class="reader-contents" type="button" aria-expanded="false">Contents</button>
</header>

<main class="reader-stage" id="stage">
  <iframe id="page" title="{{TITLE}}" sandbox="allow-same-origin"></iframe>
  <img id="plate" alt="" hidden>
  <button class="reader-zone reader-prev" type="button" aria-label="Previous page"></button>
  <button class="reader-zone reader-next" type="button" aria-label="Next page"></button>
  <button class="reader-retry" id="retry" type="button" hidden>Tap to retry</button>
</main>

<footer class="reader-rail"><span id="rail"><i></i></span><em class="reader-wait" id="wait" hidden aria-hidden="true"></em><b id="percent">0%</b></footer>

<button class="reader-scrim" type="button" aria-label="Close the panel" hidden></button>
<nav class="reader-toc" id="toc" aria-label="Contents" hidden>
  <button class="reader-toc-close" type="button" aria-label="Close the contents">×</button>
</nav>

<section class="reader-offline-panel" id="offline-panel" aria-label="Offline copy" hidden>
  <button class="reader-toc-close reader-offline-close" type="button" aria-label="Close the offline copy">×</button>
  <h2>Offline copy</h2>
  <p id="offline-state"></p>
  <button class="reader-offline-action" id="offline-action" type="button" data-action="save">Save</button>
</section>

<script src="/pwa.js?v=1" defer></script>
<script src="/reader.js?v=11" defer></script>

</body>
</html>
