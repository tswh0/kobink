<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kobink · drop a book</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{BASE}}/drop/style.css">
<style>
  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    margin: 0;
    padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
      max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
  }
  article.card {
    width: 100%;
    max-width: 26rem;
  }
  article.card header {
    border-bottom: 0;
    padding-bottom: 0;
  }
  article.card header h1 {
    margin: 0 0 .35rem;
    font-size: var(--text-3);
  }
  article.card header p {
    margin: 0;
    color: var(--muted-foreground);
    font-size: var(--text-7);
  }
  form {
    margin-top: 1.25rem;
  }
  .field {
    display: grid;
    gap: .35rem;
  }
  .field > span {
    font-size: var(--text-7);
    color: var(--muted-foreground);
  }
  .field select,
  .field input[type="file"] {
    width: 100%;
  }
  .hint {
    margin: 1.1rem 0 0;
    font-size: var(--text-7);
    color: var(--muted-foreground);
  }
  button {
    width: 100%;
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
  }
  button:hover {
    background: color-mix(in srgb, var(--primary), #000 12%);
  }
  .notice {
    margin: 1.25rem 0 0;
    font-size: var(--text-7);
  }
  .notice.ok {
    color: var(--success);
  }
  .notice.error {
    color: var(--danger);
  }
  @media (max-width: 30rem) {
    body {
      place-items: start center;
      padding-top: 2.5rem;
    }
  }
</style>
</head>
<body>

<article class="card">
  <header>
    <h1>Drop a book</h1>
    <p>An EPUB lands in the library as it is. A manga CBZ is converted to a KEPUB for your e-reader first. Either way it shows up after the next sync.</p>
  </header>

  {{NOTICE}}

  <form method="post" action="{{BASE}}/drop/upload" enctype="multipart/form-data">
    <div class="vstack gap-4">
      {{CONTROLS}}
      <div class="field">
        <span>File</span>
        <input type="file" name="file" accept=".epub,.cbz" required>
      </div>
      <button>Upload</button>
    </div>
  </form>
</article>

</body>
</html>
