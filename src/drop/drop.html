<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kobink · drop a book</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{BASE}}/drop/style.css">
<style>
  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    margin: 0;
    padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
      max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
  }
  article.card {
    width: 100%;
    max-width: 27rem;
  }
  article.card header {
    border-bottom: 0;
    padding-bottom: 0;
  }
  article.card header h1 {
    margin: 0 0 .35rem;
    font-size: var(--text-3);
  }
  article.card header p {
    margin: 0;
    color: var(--muted-foreground);
    font-size: var(--text-7);
  }
  form {
    margin-top: 1.25rem;
  }
  .field {
    display: grid;
    gap: .35rem;
  }
  .field > span {
    font-size: var(--text-7);
    color: var(--muted-foreground);
  }
  .field select,
  .field input[type="file"] {
    width: 100%;
  }
  .hint {
    margin: 0;
    font-size: var(--text-7);
    color: var(--muted-foreground);
  }
  button {
    width: 100%;
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
  }
  button:hover {
    background: color-mix(in srgb, var(--primary), #000 12%);
  }
  button:disabled {
    opacity: .55;
    cursor: progress;
  }
  .notice {
    margin: 1.25rem 0 0;
    font-size: var(--text-7);
  }
  .notice.ok {
    color: var(--success);
  }
  .notice.error {
    color: var(--danger);
  }
  .bar {
    height: .4rem;
    margin-top: 1.1rem;
    border-radius: 999px;
    background: var(--muted);
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: var(--primary);
    transition: width .18s ease;
  }
  .phase {
    margin: .55rem 0 0;
    font-size: var(--text-7);
    color: var(--muted-foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .results {
    list-style: none;
    margin: 1.1rem 0 0;
    padding: 0;
    display: grid;
    gap: .5rem;
    font-size: var(--text-7);
  }
  .results li {
    display: grid;
    gap: .1rem;
  }
  .results li span {
    overflow-wrap: anywhere;
  }
  .results li em {
    font-style: normal;
    color: var(--success);
  }
  .results li em.error {
    color: var(--danger);
  }
  @media (max-width: 30rem) {
    body {
      place-items: start center;
      padding-top: 2.5rem;
    }
  }
</style>
</head>
<body>

<article class="card">
  <header>
    <h1>Drop a book</h1>
    <p>EPUB is added as it is. CBZ and PDF are converted for your e-reader first. Either way it shows up on the reader after the next sync.</p>
  </header>

  {{NOTICE}}

  <form method="post" action="{{BASE}}/drop/upload" enctype="multipart/form-data">
    <div class="vstack gap-4">
      {{CONTROLS}}
      <div class="field">
        <span>Files</span>
        <input type="file" name="file" accept=".epub,.cbz,.pdf" multiple required>
      </div>
      <button>Upload</button>
    </div>
  </form>

  <div class="bar" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i></i></div>
  <p class="phase" hidden></p>
  <ul class="results"></ul>
</article>

<script>
  const form = document.querySelector('form');
  const input = form.querySelector('input[type="file"]');
  const profile = form.querySelector('select[name="profile"]');
  const button = form.querySelector('button');
  const bar = document.querySelector('.bar');
  const fill = bar.querySelector('i');
  const phase = document.querySelector('.phase');
  const results = document.querySelector('.results');

  form.addEventListener('submit', (event) => {
    if (!window.FormData || !input.files.length) return;
    event.preventDefault();

    const files = Array.from(input.files);
    const total = files.length;

    results.replaceChildren();
    bar.hidden = false;
    button.disabled = true;

    const progress = (fraction, label) => {
      const percent = Math.min(100, fraction * 100);
      fill.style.width = percent.toFixed(1) + '%';
      bar.setAttribute('aria-valuenow', String(Math.round(percent)));
      phase.textContent = label || '';
      phase.hidden = !label;
    };

    const entry = (name, text, ok) => {
      const item = document.createElement('li');
      const title = document.createElement('span');
      const state = document.createElement('em');
      title.textContent = name;
      state.textContent = text;
      if (!ok) state.className = 'error';
      item.append(title, state);
      results.append(item);
    };

    const next = (index) => {
      if (index === total) {
        progress(1, '');
        button.disabled = false;
        input.value = '';
        setTimeout(() => {
          bar.hidden = true;
          fill.style.width = '0';
        }, 1400);
        return;
      }

      const file = files[index];
      const body = new FormData();
      body.append('file', file);
      if (profile) body.append('profile', profile.value);

      const request = new XMLHttpRequest();
      request.open('POST', form.action);

      request.upload.addEventListener('progress', (event) => {
        if (!event.lengthComputable) return;
        progress((index + (event.loaded / event.total) * 0.85) / total, 'Uploading ' + file.name);
      });

      request.upload.addEventListener('load', () => {
        progress((index + 0.85) / total, 'Converting ' + file.name);
      });

      request.addEventListener('load', () => {
        const page = new DOMParser().parseFromString(request.responseText, 'text/html');
        const notice = page.querySelector('.notice');
        const ok = Boolean(notice && notice.classList.contains('ok'));

        entry(file.name, notice ? notice.textContent : 'The answer could not be read.', ok);
        progress((index + 1) / total, '');
        next(index + 1);
      });

      request.addEventListener('error', () => {
        entry(file.name, 'The upload failed.', false);
        next(index + 1);
      });

      request.send(body);
    };

    next(0);
  });
</script>

</body>
</html>
