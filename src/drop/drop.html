<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kobink · drop a book</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css?v=2">
<link rel="stylesheet" href="/page.css?v=2">
</head>
<body>

<main class="stage">
  <article class="card">
    <header class="masthead">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <div>
        <p class="eyebrow">kobink</p>
        <h1>Drop a book</h1>
        <p class="lede">EPUB goes in as it is. CBZ and PDF are converted for the reader first. Either way it turns up after the next sync.</p>
      </div>
    </header>

    {{NOTICE}}

    <form method="post" action="{{ACTION}}" enctype="multipart/form-data">
      <div class="vstack gap-4">
        {{CONTROLS}}
        <label class="dropper" data-drop>
          <input type="file" name="file" accept=".epub,.cbz,.pdf" multiple required>
          <span class="drop-title">Drop files here</span>
          <span class="drop-note">EPUB, CBZ, PDF · several at once is fine</span>
        </label>
        <button>Send to reader</button>
      </div>
    </form>

    <div class="bar" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i></i></div>
    <p class="phase" hidden></p>
    <ul class="results"></ul>
  </article>
</main>

<script src="/app.js?v=2" defer></script>

</body>
</html>
