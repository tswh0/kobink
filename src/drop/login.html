<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kobink · unlock</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<style>
  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    margin: 0;
    padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
      max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
  }
  article.card {
    width: 100%;
    max-width: 24rem;
  }
  article.card header {
    border-bottom: 0;
    padding-bottom: 0;
  }
  article.card header h1 {
    margin: 0 0 .35rem;
    font-size: var(--text-3);
  }
  article.card header p {
    margin: 0;
    color: var(--muted-foreground);
    font-size: var(--text-7);
  }
  form {
    margin-top: 1.25rem;
  }
  .field {
    display: grid;
    gap: .35rem;
  }
  .field > span {
    font-size: var(--text-7);
    color: var(--muted-foreground);
  }
  input[type="password"] {
    width: 100%;
    font-family: var(--font-mono);
  }
  button {
    width: 100%;
    margin-top: .25rem;
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
  }
  button:hover {
    background: color-mix(in srgb, var(--primary), #000 12%);
  }
  .notice {
    margin: 1.25rem 0 0;
    font-size: var(--text-7);
    color: var(--danger);
  }
  @media (max-width: 30rem) {
    body {
      place-items: start center;
      padding-top: 2.5rem;
    }
  }
</style>
</head>
<body>

<article class="card">
  <header>
    <h1>kobink</h1>
    <p>The API key opens this page. It is the same one on the reader.</p>
  </header>

  {{NOTICE}}

  <form method="post" action="/">
    <div class="vstack gap-4">
      <div class="field">
        <span>API key</span>
        <input type="password" name="key" autocomplete="current-password" required autofocus>
      </div>
      <button>Unlock</button>
    </div>
  </form>
</article>

</body>
</html>
