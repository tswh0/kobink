services:
  kobink:
    image: ghcr.io/tswh0/kobink:${KOBINK_TAG:-latest}
    build:
      context: .
    pull_policy: missing
    container_name: kobink
    restart: unless-stopped
    ports:
      - "${KOBINK_PORT:-3000}:3000"
    environment:
      LIBRARY_PATH: /library
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env, e.g. http://192.168.1.10:3000}
      API_KEY: ${API_KEY:-}
      API_KEY_FILE: /app/data/api-key
      LIBRARY_REFRESH_SECONDS: ${LIBRARY_REFRESH_SECONDS:-600}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${LIBRARY_DIR:-./library}:/library:ro
      - ./data:/app/data
