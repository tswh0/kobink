services:
  kobink:
    image: ghcr.io/tswh0/kobink:${KOBINK_TAG:-latest}
    build:
      context: .
      target: ${KOBINK_TARGET:-runtime}
    pull_policy: missing
    container_name: kobink
    restart: unless-stopped
    user: "${KOBINK_UID:-1000}:${KOBINK_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${KOBINK_MEMORY:-2g}
    ports:
      - "${KOBINK_PORT:-3000}:3000"
    environment:
      LIBRARY_PATH: /library
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env, e.g. http://192.168.1.10:3000}
      API_KEY: ${API_KEY:-}
      API_KEY_FILE: /app/data/api-key
      COVER_CACHE_DIR: /app/data/covers
      LIBRARY_REFRESH_SECONDS: ${LIBRARY_REFRESH_SECONDS:-600}
      COVER_CACHE_DAYS: ${COVER_CACHE_DAYS:-30}
      TRASH_DAYS: ${TRASH_DAYS:-30}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - "${LIBRARY_DIR:-./library}:/library${LIBRARY_WRITE:-:ro}"
      - ./data:/app/data
