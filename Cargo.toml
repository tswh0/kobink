[package]
name = "kobink"
version = "1.4.0"
edition = "2021"
rust-version = "1.99"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.29", features = ["rt-multi-thread", "macros", "net", "time", "fs", "process", "io-util", "sync"] }
tower-http = { version = "0.7", features = ["compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.23"
uuid = { version = "1.6.1", features = ["v4", "fast-rng", "serde"] }
walkdir = "2.4.0"
epub = "2.1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
